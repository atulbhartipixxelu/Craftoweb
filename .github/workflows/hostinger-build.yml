name: Build for Hostinger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build marketing site
        run: |
          npm ci
          npm run build:hostinger

      - name: Build admin dashboard
        run: |
          npm ci
          cd ..
          npm run build:hostinger-admin
        working-directory: dashboard-Backend
        env:
          VITE_API_URL: https://api.craftoweb.com/api

      - name: Commit Hostinger builds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: production builds for Hostinger (site + admin)'
          file_pattern: |
            hostinger-public/**
            admin/**
