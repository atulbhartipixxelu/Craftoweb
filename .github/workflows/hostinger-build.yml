name: Build for Hostinger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build:hostinger

      - name: Commit hostinger-public
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: production build for Hostinger (hostinger-public)'
          file_pattern: hostinger-public/**
          branch: ${{ github.ref_name }}
